<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0d1527" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>
    <linearGradient id="purple-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f857a6" />
      <stop offset="100%" stop-color="#ff5858" />
    </linearGradient>
    <linearGradient id="shield-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#7f00ff" stop-opacity="0.8" />
    </linearGradient>

    <!-- Filters for Glow Effects -->
    <filter id="glow-blur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 46px;
        fill: #ffffff;
        letter-spacing: -0.5px;
      }
      .subtitle-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 500;
        font-size: 21px;
        fill: #94a3b8;
      }
      .pill-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 13px;
        fill: #e2e8f0;
      }
      .grid-line {
        stroke: rgba(255, 255, 255, 0.04);
        stroke-width: 1;
      }

      /* Dynamic Animated Scanning Beam */
      @keyframes scanBeam {
        0% { transform: translateY(-50px); opacity: 0; }
        20% { opacity: 0.8; }
        80% { opacity: 0.8; }
        100% { transform: translateY(420px); opacity: 0; }
      }
      .scanner-beam {
        animation: scanBeam 4.5s ease-in-out infinite;
      }

      /* Dynamic Pulse Glow */
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.65; transform: scale(1.08); }
      }
      .glowing-orb-1 {
        animation: pulseGlow 6s ease-in-out infinite;
        transform-origin: 200px 100px;
      }
      .glowing-orb-2 {
        animation: pulseGlow 7s ease-in-out infinite 1.5s;
        transform-origin: 1000px 280px;
      }

      /* Dynamic Floating Nodes */
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-10px); }
      }
      .float-badge-1 {
        animation: floatSlow 5s ease-in-out infinite;
      }
      .float-badge-2 {
        animation: floatSlow 5.5s ease-in-out infinite 1s;
      }
      .float-badge-3 {
        animation: floatSlow 6s ease-in-out infinite 2s;
      }

      /* Stream Lines */
      @keyframes streamFlow {
        0% { stroke-dashoffset: 200; }
        100% { stroke-dashoffset: 0; }
      }
      .flow-line {
        stroke-dasharray: 12, 12;
        animation: streamFlow 2s linear infinite;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="400" fill="url(#bg-grad)" rx="16" />

  <!-- Animated Ambient Orbs (Background layer) -->
  <circle class="glowing-orb-1" cx="200" cy="100" r="140" fill="#00f2fe" opacity="0.3" filter="url(#glow-blur)" />
  <circle class="glowing-orb-2" cx="1020" cy="280" r="160" fill="#7f00ff" opacity="0.25" filter="url(#glow-blur)" />
  <circle cx="600" cy="380" r="100" fill="#f857a6" opacity="0.15" filter="url(#glow-blur)" />

  <!-- Tech Grid Background -->
  <g>
    <line x1="0" y1="80" x2="1200" y2="80" class="grid-line" />
    <line x1="0" y1="160" x2="1200" y2="160" class="grid-line" />
    <line x1="0" y1="240" x2="1200" y2="240" class="grid-line" />
    <line x1="0" y1="320" x2="1200" y2="320" class="grid-line" />

    <line x1="150" y1="0" x2="150" y2="400" class="grid-line" />
    <line x1="300" y1="0" x2="300" y2="400" class="grid-line" />
    <line x1="450" y1="0" x2="450" y2="400" class="grid-line" />
    <line x1="600" y1="0" x2="600" y2="400" class="grid-line" />
    <line x1="750" y1="0" x2="750" y2="400" class="grid-line" />
    <line x1="900" y1="0" x2="900" y2="400" class="grid-line" />
    <line x1="1050" y1="0" x2="1050" y2="400" class="grid-line" />
  </g>

  <!-- Dynamic Cyber Scanning Beam -->
  <g class="scanner-beam">
    <line x1="80" y1="0" x2="1120" y2="0" stroke="url(#cyan-glow)" stroke-width="2" filter="url(#soft-glow)" />
    <polygon points="80,0 1120,0 1100,20 100,20" fill="url(#cyan-glow)" opacity="0.08" />
  </g>

  <!-- Flowing Data Streams (Behind text) -->
  <path d="M 100,320 Q 350,370 600,320 T 1100,320" fill="none" stroke="#00f2fe" stroke-width="2" opacity="0.25" class="flow-line" />
  <path d="M 120,80 Q 400,30 700,80 T 1080,70" fill="none" stroke="#f857a6" stroke-width="2" opacity="0.2" class="flow-line" />

  <!-- Shield Icon Motif in Background Behind Title -->
  <g transform="translate(600, 72) scale(0.65)" opacity="0.12">
    <path d="M 0,-40 L 50,-15 L 50,35 Q 50,75 0,100 Q -50,75 -50,35 L -50,-15 Z" fill="url(#shield-grad)" />
  </g>

  <!-- FOREGROUND CONTENT: Header & Badges (Completely clear, unblocked) -->
  <g transform="translate(600, 110)">
    <!-- Top Pill / Status Tag -->
    <rect x="-140" y="-48" width="280" height="30" rx="15" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" opacity="0.9" />
    <circle cx="-120" cy="-33" r="4.5" fill="#00f2fe" filter="url(#soft-glow)" />
    <text x="-105" y="-28" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#38bdf8" letter-spacing="1">TRUST &amp; SAFETY ECOSYSTEM</text>

    <!-- Main Title -->
    <text class="title-text" text-anchor="middle" y="25">
      Content Moderation &amp; AI Slop Filtering
    </text>

    <!-- Subtitle / Mission -->
    <text class="subtitle-text" text-anchor="middle" y="68">
      Curated Catalog of Enterprise SaaS, Guardrail APIs &amp; Open-Source Detection Frameworks
    </text>
  </g>

  <!-- Floating Feature Badges (Foreground / Bottom Half) -->
  <g transform="translate(180, 260)" class="float-badge-1">
    <rect x="0" y="0" width="240" height="56" rx="12" fill="#0f172a" stroke="rgba(0, 242, 254, 0.4)" stroke-width="1.5" />
    <circle cx="28" cy="28" r="14" fill="#00f2fe" opacity="0.15" />
    <text x="28" y="33" text-anchor="middle" font-size="16">🛡️</text>
    <text x="56" y="26" class="pill-text">AI Slop Detection</text>
    <text x="56" y="44" font-family="-apple-system, sans-serif" font-size="11" fill="#64748b">Synthetic &amp; Low-Effort Feeds</text>
  </g>

  <g transform="translate(480, 260)" class="float-badge-2">
    <rect x="0" y="0" width="240" height="56" rx="12" fill="#0f172a" stroke="rgba(127, 0, 255, 0.4)" stroke-width="1.5" />
    <circle cx="28" cy="28" r="14" fill="#7f00ff" opacity="0.15" />
    <text x="28" y="33" text-anchor="middle" font-size="16">⚡</text>
    <text x="56" y="26" class="pill-text">LLM Safety Guardrails</text>
    <text x="56" y="44" font-family="-apple-system, sans-serif" font-size="11" fill="#64748b">Prompt Injection &amp; Toxicity</text>
  </g>

  <g transform="translate(780, 260)" class="float-badge-3">
    <rect x="0" y="0" width="240" height="56" rx="12" fill="#0f172a" stroke="rgba(248, 87, 166, 0.4)" stroke-width="1.5" />
    <circle cx="28" cy="28" r="14" fill="#f857a6" opacity="0.15" />
    <text x="28" y="33" text-anchor="middle" font-size="16">👁️</text>
    <text x="56" y="26" class="pill-text">Multimodal NSFW &amp; Spam</text>
    <text x="56" y="44" font-family="-apple-system, sans-serif" font-size="11" fill="#64748b">Images, Video &amp; Text Pipelines</text>
  </g>

  <!-- Bottom Border Highlight -->
  <line x1="0" y1="399" x2="1200" y2="399" stroke="url(#cyan-glow)" stroke-width="2" opacity="0.8" />
</svg>
