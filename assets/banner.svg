<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 400"><defs><linearGradient id="bg-grad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0a0f1d"/><stop offset="50%" stop-color="#0d1527"/><stop offset="100%" stop-color="#050811"/></linearGradient><linearGradient id="cyan-glow" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#00f2fe"/><stop offset="100%" stop-color="#4facfe"/></linearGradient><linearGradient id="purple-glow" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#f857a6"/><stop offset="100%" stop-color="#ff5858"/></linearGradient><linearGradient id="shield-grad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#00f2fe" stop-opacity=".8"/><stop offset="100%" stop-color="#7f00ff" stop-opacity=".8"/></linearGradient><filter id="glow-blur" width="160%" height="160%" x="-30%" y="-30%"><feGaussianBlur result="blur" stdDeviation="15"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><filter id="soft-glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><style>@keyframes scanBeam{0%{transform:translateY(-50px);opacity:0}20%,80%{opacity:.8}}@keyframes pulseGlow{0%{opacity:.35;transform:scale(1)}50%{opacity:.65;transform:scale(1.08)}}@keyframes floatSlow{0%{transform:translateY(0)}50%{transform:translateY(-10px)}}@keyframes streamFlow{0%{stroke-dashoffset:200}}.pill-text,.subtitle-text,.title-text{font-family:-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}.title-text{font-weight:800;font-size:46px;fill:#fff;letter-spacing:-.5px}.subtitle-text{font-weight:500;font-size:21px;fill:#94a3b8}.pill-text{font-weight:600;font-size:13px;fill:#e2e8f0}.grid-line{stroke:rgba(255,255,255,.04);stroke-width:1}.scanner-beam{animation:scanBeam 4.5s ease-in-out infinite}.glowing-orb-1{animation:pulseGlow 6s ease-in-out infinite;transform-origin:200px 100px}.glowing-orb-2{animation:pulseGlow 7s ease-in-out infinite 1.5s;transform-origin:1000px 280px}.float-badge-1{animation:floatSlow 5s ease-in-out infinite}.float-badge-2{animation:floatSlow 5.5s ease-in-out infinite 1s}.float-badge-3{animation:floatSlow 6s ease-in-out infinite 2s}.flow-line{stroke-dasharray:12,12;animation:streamFlow 2s linear infinite}</style></defs><rect width="1200" height="400" fill="url(#bg-grad)" rx="16"/><circle cx="200" cy="100" r="140" fill="#00f2fe" class="glowing-orb-1" filter="url(#glow-blur)" opacity=".3"/><circle cx="1020" cy="280" r="160" fill="#7f00ff" class="glowing-orb-2" filter="url(#glow-blur)" opacity=".25"/><circle cx="600" cy="380" r="100" fill="#f857a6" filter="url(#glow-blur)" opacity=".15"/><g><line x1="0" x2="1200" y1="80" y2="80" class="grid-line"/><line x1="0" x2="1200" y1="160" y2="160" class="grid-line"/><line x1="0" x2="1200" y1="240" y2="240" class="grid-line"/><line x1="0" x2="1200" y1="320" y2="320" class="grid-line"/><line x1="150" x2="150" y1="0" y2="400" class="grid-line"/><line x1="300" x2="300" y1="0" y2="400" class="grid-line"/><line x1="450" x2="450" y1="0" y2="400" class="grid-line"/><line x1="600" x2="600" y1="0" y2="400" class="grid-line"/><line x1="750" x2="750" y1="0" y2="400" class="grid-line"/><line x1="900" x2="900" y1="0" y2="400" class="grid-line"/><line x1="1050" x2="1050" y1="0" y2="400" class="grid-line"/></g><g class="scanner-beam"><line x1="80" x2="1120" y1="0" y2="0" stroke="url(#cyan-glow)" stroke-width="2" filter="url(#soft-glow)"/><polygon fill="url(#cyan-glow)" points="80 0 1120 0 1100 20 100 20" opacity=".08"/></g><path fill="none" stroke="#00f2fe" stroke-width="2" d="M 100,320 Q 350,370 600,320 T 1100,320" class="flow-line" opacity=".25"/><path fill="none" stroke="#f857a6" stroke-width="2" d="M 120,80 Q 400,30 700,80 T 1080,70" class="flow-line" opacity=".2"/><g opacity=".12"><path fill="url(#shield-grad)" d="M 0,-40 L 50,-15 L 50,35 Q 50,75 0,100 Q -50,75 -50,35 L -50,-15 Z" transform="translate(600, 72) scale(0.65)"/></g><g transform="translate(600, 110)"><rect width="280" height="30" x="-140" y="-48" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" opacity=".9" rx="15"/><circle cx="-120" cy="-33" r="4.5" fill="#00f2fe" filter="url(#soft-glow)"/><text x="-105" y="-28" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="1">TRUST &amp; SAFETY ECOSYSTEM</text><text y="25" class="title-text" text-anchor="middle">Content Moderation &amp; AI Slop Filtering</text><text y="68" class="subtitle-text" text-anchor="middle">Curated Catalog of Enterprise SaaS, Guardrail APIs &amp; Open-Source Detection Frameworks</text></g><g class="float-badge-1" transform="translate(180, 260)"><rect width="240" height="56" x="0" y="0" fill="#0f172a" stroke="rgba(0, 242, 254, 0.4)" stroke-width="1.5" rx="12"/><circle cx="28" cy="28" r="14" fill="#00f2fe" opacity=".15"/><text x="28" y="33" font-size="16" text-anchor="middle">🛡️</text><text x="56" y="26" class="pill-text">AI Slop Detection</text><text x="56" y="44" fill="#64748b" font-family="-apple-system, sans-serif" font-size="11">Synthetic &amp; Low-Effort Feeds</text></g><g class="float-badge-2" transform="translate(480, 260)"><rect width="240" height="56" x="0" y="0" fill="#0f172a" stroke="rgba(127, 0, 255, 0.4)" stroke-width="1.5" rx="12"/><circle cx="28" cy="28" r="14" fill="#7f00ff" opacity=".15"/><text x="28" y="33" font-size="16" text-anchor="middle">⚡</text><text x="56" y="26" class="pill-text">LLM Safety Guardrails</text><text x="56" y="44" fill="#64748b" font-family="-apple-system, sans-serif" font-size="11">Prompt Injection &amp; Toxicity</text></g><g class="float-badge-3" transform="translate(780, 260)"><rect width="240" height="56" x="0" y="0" fill="#0f172a" stroke="rgba(248, 87, 166, 0.4)" stroke-width="1.5" rx="12"/><circle cx="28" cy="28" r="14" fill="#f857a6" opacity=".15"/><text x="28" y="33" font-size="16" te